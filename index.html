<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>くるまれいんず - 車両検索データベース</title>
    <meta name="description" content="中古車販売カスタマーセンター向け車両データベース。条件を絞り込んでお客様に最適な一台を提案。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="reins.css">
</head>
<body>
    <!-- Ambient background effects -->
    <div class="ambient-bg">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
    </div>

    <!-- Header -->
    <header class="header" id="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M7 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/>
                        <path d="M17 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/>
                        <path d="M5 17H3v-6l2-5h9l4 5h1a2 2 0 0 1 2 2v4h-2m-4 0H9"/>
                        <path d="M10 6l-1 5h8"/>
                    </svg>
                </div>
                <span class="logo-text">くるま<span class="logo-accent">れいんず</span></span>
            </div>
            <div class="header-actions">
                <!-- Inventory Toggle -->
                <label class="inv-toggle" title="在庫モード切替">
                    <input type="checkbox" id="inventoryToggle">
                    <span class="inv-toggle-slider"></span>
                </label>
                <div class="stat-badge inv-badge" id="inventoryBadge">読込中</div>
                <div class="stat-badge" id="totalCarsCount">
                    <span class="stat-number">0</span>
                    <span class="stat-label">登録車種</span>
                </div>
                <div class="stat-badge hit-count" id="hitCount" style="display:none">
                    <span class="stat-number" id="hitNumber">0</span>
                    <span class="stat-label">件ヒット</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Inventory Info Bar -->
    <div class="inventory-info-bar" id="inventoryInfo">
        <div class="inv-info-left">
            <span class="inv-shop-icon">🏪</span>
            <span class="inv-shop-name" id="shopNameText"></span>
        </div>
        <div class="inv-info-right">
            <span class="inv-last-updated" id="lastUpdatedText"></span>
            <a href="https://www.carsensor.net/shop/nara/326138005/" target="_blank" class="inv-cs-link">カーセンサーで見る ↗</a>
        </div>
    </div>

    <!-- Main Layout: Sidebar + Content -->
    <div class="reins-layout">
        <!-- ===== LEFT: Filter Sidebar ===== -->
        <aside class="filter-sidebar" id="filterSidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">🔍 条件で検索</h2>
                <button class="reset-btn" id="resetFilters">リセット</button>
            </div>

            <!-- Keyword Search -->
            <div class="filter-group">
                <label class="filter-label">🔤 キーワード</label>
                <input type="text" class="filter-input" id="keywordInput" placeholder="車種名・メーカー名で検索">
            </div>

            <!-- Maker Chip-Select -->
            <div class="filter-group">
                <label class="filter-label">🏭 メーカー</label>
                <div class="chip-select" id="makerChips">
                    <button class="cs-toggle" type="button"><span class="cs-text">すべてのメーカー</span><span class="cs-arrow">▾</span></button>
                    <div class="cs-panel cs-panel-wide">
                        <span class="chip-section">🇯🇵 国産メーカー</span>
                        <button class="chip chip-lg" data-value="トヨタ" type="button"><img src="https://www.carlogos.org/car-logos/toyota-logo.png" class="chip-logo" alt="">トヨタ</button>
                        <button class="chip chip-lg" data-value="ホンダ" type="button"><img src="https://www.carlogos.org/car-logos/honda-logo.png" class="chip-logo" alt="">ホンダ</button>
                        <button class="chip chip-lg" data-value="日産" type="button"><img src="https://www.carlogos.org/car-logos/nissan-logo.png" class="chip-logo" alt="">日産</button>
                        <button class="chip chip-lg" data-value="マツダ" type="button"><img src="https://www.carlogos.org/car-logos/mazda-logo.png" class="chip-logo" alt="">マツダ</button>
                        <button class="chip chip-lg" data-value="スバル" type="button"><img src="https://www.carlogos.org/car-logos/subaru-logo.png" class="chip-logo" alt="">スバル</button>
                        <button class="chip chip-lg" data-value="スズキ" type="button"><img src="https://www.carlogos.org/car-logos/suzuki-logo.png" class="chip-logo" alt="">スズキ</button>
                        <button class="chip chip-lg" data-value="ダイハツ" type="button"><img src="https://www.carlogos.org/car-logos/daihatsu-logo.png" class="chip-logo" alt="">ダイハツ</button>
                        <button class="chip chip-lg" data-value="三菱" type="button"><img src="https://www.carlogos.org/car-logos/mitsubishi-logo.png" class="chip-logo" alt="">三菱</button>
                        <button class="chip chip-lg" data-value="レクサス" type="button"><img src="https://www.carlogos.org/car-logos/lexus-logo.png" class="chip-logo" alt="">レクサス</button>
                        <button class="chip chip-lg" data-value="光岡" type="button">🔹 光岡</button>
                        <span class="chip-section">🌍 輸入メーカー</span>
                        <button class="chip chip-lg" data-value="メルセデス・ベンツ" type="button"><img src="https://www.carlogos.org/car-logos/mercedes-benz-logo.png" class="chip-logo" alt="">ベンツ</button>
                        <button class="chip chip-lg" data-value="BMW" type="button"><img src="https://www.carlogos.org/car-logos/bmw-logo.png" class="chip-logo" alt="">BMW</button>
                        <button class="chip chip-lg" data-value="アウディ" type="button"><img src="https://www.carlogos.org/car-logos/audi-logo.png" class="chip-logo" alt="">アウディ</button>
                        <button class="chip chip-lg" data-value="フォルクスワーゲン" type="button"><img src="https://www.carlogos.org/car-logos/volkswagen-logo.png" class="chip-logo" alt="">VW</button>
                        <button class="chip chip-lg" data-value="ボルボ" type="button"><img src="https://www.carlogos.org/car-logos/volvo-logo.png" class="chip-logo" alt="">ボルボ</button>
                        <button class="chip chip-lg" data-value="MINI" type="button"><img src="https://www.carlogos.org/car-logos/mini-logo.png" class="chip-logo" alt="">MINI</button>
                        <button class="chip chip-lg" data-value="ポルシェ" type="button"><img src="https://www.carlogos.org/car-logos/porsche-logo.png" class="chip-logo" alt="">ポルシェ</button>
                        <button class="chip chip-lg" data-value="テスラ" type="button"><img src="https://www.carlogos.org/car-logos/tesla-logo.png" class="chip-logo" alt="">テスラ</button>
                        <button class="chip chip-lg" data-value="ジープ" type="button"><img src="https://www.carlogos.org/car-logos/jeep-logo.png" class="chip-logo" alt="">ジープ</button>
                        <button class="chip chip-lg" data-value="ランドローバー" type="button"><img src="https://www.carlogos.org/car-logos/land-rover-logo.png" class="chip-logo" alt="">ランドローバー</button>
                        <button class="chip chip-lg" data-value="ジャガー" type="button"><img src="https://www.carlogos.org/car-logos/jaguar-logo.png" class="chip-logo" alt="">ジャガー</button>
                        <button class="chip chip-lg" data-value="フェラーリ" type="button"><img src="https://www.carlogos.org/car-logos/ferrari-logo.png" class="chip-logo" alt="">フェラーリ</button>
                        <button class="chip chip-lg" data-value="ランボルギーニ" type="button"><img src="https://www.carlogos.org/car-logos/lamborghini-logo.png" class="chip-logo" alt="">ランボルギーニ</button>
                        <button class="chip chip-lg" data-value="ヒョンデ" type="button"><img src="https://www.carlogos.org/car-logos/hyundai-logo.png" class="chip-logo" alt="">ヒョンデ</button>
                        <button class="chip chip-lg" data-value="BYD" type="button"><img src="https://www.carlogos.org/car-logos/byd-logo.png" class="chip-logo" alt="">BYD</button>
                        <button class="chip chip-lg chip-special" data-value="__import__" type="button">🌐 輸入車すべて</button>
                    </div>
                </div>
            </div>

            <!-- Body Type Chip-Select -->
            <div class="filter-group">
                <label class="filter-label">🚘 ボディタイプ</label>
                <div class="chip-select" id="typeChips">
                    <button class="cs-toggle" type="button"><span class="cs-text">すべて</span><span class="cs-arrow">▾</span></button>
                    <div class="cs-panel cs-panel-wide cs-panel-2col">
                        <button class="chip chip-lg" data-value="軽自動車" type="button">🚐 軽自動車</button>
                        <button class="chip chip-lg" data-value="コンパクト" type="button">🚗 コンパクト</button>
                        <button class="chip chip-lg" data-value="セダン" type="button">🏎️ セダン</button>
                        <button class="chip chip-lg" data-value="SUV" type="button">🚙 SUV</button>
                        <button class="chip chip-lg" data-value="ミニバン" type="button">🚌 ミニバン</button>
                        <button class="chip chip-lg" data-value="ワゴン" type="button">🚃 ワゴン</button>
                        <button class="chip chip-lg" data-value="クーペ" type="button">🏁 クーペ/スポーツ</button>
                        <button class="chip chip-lg" data-value="トラック" type="button">🚛 トラック/商用</button>
                    </div>
                </div>
            </div>

            <!-- Fuel Type Chip-Select -->
            <div class="filter-group">
                <label class="filter-label">⛽ 燃料タイプ</label>
                <div class="chip-select" id="fuelChips">
                    <button class="cs-toggle" type="button"><span class="cs-text">すべて</span><span class="cs-arrow">▾</span></button>
                    <div class="cs-panel cs-panel-wide cs-panel-single">
                        <button class="chip chip-lg" data-value="ガソリン" type="button">⛽ ガソリン</button>
                        <button class="chip chip-lg" data-value="ハイブリッド" type="button">🔋 HV（ハイブリッド）</button>
                        <button class="chip chip-lg" data-value="ディーゼル" type="button">🛢️ ディーゼル</button>
                        <button class="chip chip-lg" data-value="EV" type="button">⚡ EV（電気自動車）</button>
                        <button class="chip chip-lg" data-value="PHEV" type="button">🔌 PHEV</button>
                        <button class="chip chip-lg" data-value="e-POWER" type="button">🔄 e-POWER</button>
                    </div>
                </div>
            </div>

            <!-- Seats Chip-Select -->
            <div class="filter-group">
                <label class="filter-label">👥 乗車定員</label>
                <div class="chip-select" id="seatsChips">
                    <button class="cs-toggle" type="button"><span class="cs-text">すべて</span><span class="cs-arrow">▾</span></button>
                    <div class="cs-panel cs-panel-wide cs-panel-single">
                        <button class="chip chip-lg" data-value="2" type="button">👤 2人</button>
                        <button class="chip chip-lg" data-value="4" type="button">👥 4人</button>
                        <button class="chip chip-lg" data-value="5" type="button">👥 5人</button>
                        <button class="chip chip-lg" data-value="7" type="button">👨‍👩‍👧‍👦 7人</button>
                        <button class="chip chip-lg" data-value="8" type="button">🚐 8人+</button>
                    </div>
                </div>
            </div>

            <!-- Drive Chip-Select -->
            <div class="filter-group">
                <label class="filter-label">🛞 駆動方式</label>
                <div class="chip-select" id="driveChips">
                    <button class="cs-toggle" type="button"><span class="cs-text">すべて</span><span class="cs-arrow">▾</span></button>
                    <div class="cs-panel cs-panel-wide cs-panel-single">
                        <button class="chip chip-lg" data-value="FF" type="button">🔄 FF（前輪駆動）</button>
                        <button class="chip chip-lg" data-value="FR" type="button">⚙️ FR（後輪駆動）</button>
                        <button class="chip chip-lg" data-value="4WD" type="button">🏔️ 4WD / AWD</button>
                        <button class="chip chip-lg" data-value="MR" type="button">🏎️ MR（ミッドシップ）</button>
                    </div>
                </div>
            </div>

            <!-- Fuel Economy: Dual Range Slider -->
            <div class="filter-group">
                <label class="filter-label">⛽ 燃費（WLTC km/L）</label>
                <div class="dual-range-container" id="dualFuelEco" data-min="0" data-max="40" data-step="0.1" data-unit="km/L">
                    <div class="dual-range-inputs">
                        <input type="number" class="dr-text" id="fuelEcoMinInput" placeholder="下限" step="0.1" min="0" max="40">
                        <span class="range-separator">〜</span>
                        <input type="number" class="dr-text" id="fuelEcoMaxInput" placeholder="上限" step="0.1" min="0" max="40">
                        <span class="range-unit">km/L</span>
                    </div>
                    <div class="dual-range-track">
                        <input type="range" class="dr-slider dr-min" min="0" max="40" step="0.1" value="0">
                        <input type="range" class="dr-slider dr-max" min="0" max="40" step="0.1" value="40">
                        <div class="dr-highlight"></div>
                    </div>
                </div>
            </div>

            <!-- Size: Collapsible group for width/length/height -->
            <div class="filter-group">
                <label class="filter-label">📐 サイズ</label>
                <div class="chip-select" id="sizeToggleGroup">
                    <button class="cs-toggle" type="button"><span class="cs-text">指定なし</span><span class="cs-arrow">▾</span></button>
                    <div class="cs-panel cs-panel-wide cs-panel-size">
                        <div class="size-slider-group">
                            <label class="size-sub-label">↔️ 全幅（mm）</label>
                            <div class="dual-range-container" id="dualWidth" data-min="1200" data-max="2200" data-step="5" data-unit="mm">
                                <div class="dual-range-inputs">
                                    <input type="number" class="dr-text" id="widthMinInput" placeholder="下限" step="1" min="1200" max="2200">
                                    <span class="range-separator">〜</span>
                                    <input type="number" class="dr-text" id="widthMaxInput" placeholder="上限" step="1" min="1200" max="2200">
                                    <span class="range-unit">mm</span>
                                </div>
                                <div class="dual-range-track">
                                    <input type="range" class="dr-slider dr-min" min="1200" max="2200" step="5" value="1200">
                                    <input type="range" class="dr-slider dr-max" min="1200" max="2200" step="5" value="2200">
                                    <div class="dr-highlight"></div>
                                </div>
                            </div>
                        </div>
                        <div class="size-slider-group">
                            <label class="size-sub-label">↕️ 全長（mm）</label>
                            <div class="dual-range-container" id="dualLength" data-min="2500" data-max="6000" data-step="10" data-unit="mm">
                                <div class="dual-range-inputs">
                                    <input type="number" class="dr-text" id="lengthMinInput" placeholder="下限" step="1" min="2500" max="6000">
                                    <span class="range-separator">〜</span>
                                    <input type="number" class="dr-text" id="lengthMaxInput" placeholder="上限" step="1" min="2500" max="6000">
                                    <span class="range-unit">mm</span>
                                </div>
                                <div class="dual-range-track">
                                    <input type="range" class="dr-slider dr-min" min="2500" max="6000" step="10" value="2500">
                                    <input type="range" class="dr-slider dr-max" min="2500" max="6000" step="10" value="6000">
                                    <div class="dr-highlight"></div>
                                </div>
                            </div>
                        </div>
                        <div class="size-slider-group">
                            <label class="size-sub-label">📏 全高（mm）</label>
                            <div class="dual-range-container" id="dualHeight" data-min="1000" data-max="2500" data-step="5" data-unit="mm">
                                <div class="dual-range-inputs">
                                    <input type="number" class="dr-text" id="heightMinInput" placeholder="下限" step="1" min="1000" max="2500">
                                    <span class="range-separator">〜</span>
                                    <input type="number" class="dr-text" id="heightMaxInput" placeholder="上限" step="1" min="1000" max="2500">
                                    <span class="range-unit">mm</span>
                                </div>
                                <div class="dual-range-track">
                                    <input type="range" class="dr-slider dr-min" min="1000" max="2500" step="5" value="1000">
                                    <input type="range" class="dr-slider dr-max" min="1000" max="2500" step="5" value="2500">
                                    <div class="dr-highlight"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Year: Dual Range Slider -->
            <div class="filter-group">
                <label class="filter-label">📅 年式</label>
                <div class="dual-range-container" id="dualYear" data-min="1990" data-max="2026" data-step="1" data-unit="年">
                    <div class="dual-range-inputs">
                        <input type="number" class="dr-text" id="yearMinInput" placeholder="下限" step="1" min="1990" max="2026">
                        <span class="range-separator">〜</span>
                        <input type="number" class="dr-text" id="yearMaxInput" placeholder="上限" step="1" min="1990" max="2026">
                        <span class="range-unit">年</span>
                    </div>
                    <div class="dual-range-track">
                        <input type="range" class="dr-slider dr-min" min="1990" max="2026" step="1" value="1990">
                        <input type="range" class="dr-slider dr-max" min="1990" max="2026" step="1" value="2026">
                        <div class="dr-highlight"></div>
                    </div>
                </div>
            </div>

            <!-- Budget: Inventory-only -->
            <div class="filter-group" id="budgetFilterGroup" style="display:none">
                <label class="filter-label">💰 予算（万円）</label>
                <div class="dual-range-container" id="dualBudget" data-min="0" data-max="1000" data-step="5" data-unit="万円">
                    <div class="dual-range-inputs">
                        <input type="number" class="dr-text" id="budgetMinInput" placeholder="下限" step="5" min="0" max="1000">
                        <span class="range-separator">〜</span>
                        <input type="number" class="dr-text" id="budgetMaxInput" placeholder="上限" step="5" min="0" max="1000">
                        <span class="range-unit">万円</span>
                    </div>
                    <div class="dual-range-track">
                        <input type="range" class="dr-slider dr-min" min="0" max="1000" step="5" value="0">
                        <input type="range" class="dr-slider dr-max" min="0" max="1000" step="5" value="1000">
                        <div class="dr-highlight"></div>
                    </div>
                </div>
            </div>

            <!-- Search Button -->
            <button class="search-execute-btn" id="executeSearch">
                🔍 この条件で検索する
            </button>
        </aside>

        <!-- ===== RIGHT: Results Area ===== -->
        <main class="results-area" id="resultsArea">
            <!-- Quick Stats Bar -->
            <div class="quick-stats" id="quickStats">
                <span class="qs-label">検索結果:</span>
                <span class="qs-count" id="qsCount">-</span>
                <span class="qs-label">件</span>
                <div class="qs-sort">
                    <label>並び替え:</label>
                    <select id="sortSelect" class="sort-select">
                        <option value="maker">メーカー順</option>
                        <option value="name">車種名順</option>
                        <option value="seats">定員順</option>
                        <option value="fuelEco">燃費順</option>
                        <option value="width">全幅(小さい順)</option>
                        <option value="length">全長(小さい順)</option>
                    </select>
                </div>
                <div class="qs-view-toggle">
                    <button class="view-btn active" data-view="table" id="viewTable" title="テーブル表示">☰</button>
                    <button class="view-btn" data-view="grid" id="viewGrid" title="カード表示">▦</button>
                </div>
            </div>

            <!-- Results Table -->
            <div class="results-table-wrap" id="resultsTableWrap">
                <table class="results-table" id="resultsTable">
                    <thead>
                        <tr>
                            <th class="th-maker">メーカー</th>
                            <th class="th-name">車種名</th>
                            <th class="th-type">タイプ</th>
                            <th class="th-fuel">燃料</th>
                            <th class="th-fueleco">燃費</th>
                            <th class="th-seats">定員</th>
                            <th class="th-size">全長</th>
                            <th class="th-size">全幅</th>
                            <th class="th-size">全高</th>
                            <th class="th-price">新車価格</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody">
                    </tbody>
                </table>
            </div>

            <!-- Results Grid (card view) -->
            <div class="results-grid" id="resultsGrid" style="display:none">
            </div>

            <!-- No Results -->
            <div class="no-results-reins" id="noResults" style="display:none">
                <div class="no-results-icon">🔍</div>
                <div class="no-results-text">条件に合う車種が見つかりませんでした</div>
                <div class="no-results-hint">フィルター条件を緩めてみてください</div>
            </div>
        </main>
    </div>

    <!-- Car Detail Modal -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal" id="carModal">
            <button class="modal-close" id="modalClose">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
            <div class="modal-content" id="modalContent">
            </div>
        </div>
    </div>

    <!-- Compare Panel (floating bottom) -->
    <div class="compare-panel" id="comparePanel">
        <div class="compare-panel-header">
            <span>🔀 <span id="compareCount">0</span>台</span>
        </div>
        <div class="compare-slots" id="compareSlots"></div>
        <button class="compare-start-btn" id="compareBtn">比較する</button>
    </div>

    <!-- Compare Modal -->
    <div class="compare-modal-overlay" id="compareModal" style="display:none;">
        <div class="compare-modal">
            <button class="modal-close" id="compareModalClose">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
            <h2 class="compare-modal-title">🔀 車両比較</h2>
            <div class="compare-content" id="compareContent"></div>
        </div>
