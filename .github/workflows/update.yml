name: 🚗 在庫データ更新

on:
  # 毎朝8時に自動実行（日本時間）
  schedule:
    - cron: '0 23 * * *'  # UTC 23:00 = JST 08:00
  # 手動実行ボタン（ブラウザ・スマホからポチれる）
  workflow_dispatch:

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 コードを取得
        uses: actions/checkout@v4

      - name: 🐍 Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📡 カーセンサーから在庫データ取得
        run: python3 inventory/scraper.py

      - name: 📦 デプロイ用ZIPを作成
        run: |
          # deploy.py, scraper.py, .github等を除外してZIP作成
          zip -r deploy.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x "deploy.py" \
            -x "update.command" \
            -x ".netlify_token" \
            -x ".gitignore" \
            -x "*.py"

      - name: 🚀 Netlifyにデプロイ
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Content-Type: application/zip" \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_TOKEN }}" \
            --data-binary @deploy.zip \
            "https://api.netlify.com/api/v1/sites/${{ secrets.NETLIFY_SITE_ID }}/deploys")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ デプロイ成功！"
            echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'🌐 URL: {d.get(\"ssl_url\",\"\")}'); print(f'📊 状態: {d.get(\"state\",\"\")}')"
          else
            echo "❌ デプロイ失敗 (HTTP $HTTP_CODE)"
            echo "$BODY"
            exit 1
          fi

      - name: 📝 在庫データをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inventory/inventory.json inventory/inventory.js
          git diff --staged --quiet || git commit -m "🚗 在庫データ更新 $(date '+%Y/%m/%d %H:%M')"
          git push
