name: 🚗 在庫データ更新

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 コードを取得
        uses: actions/checkout@v5

      - name: 🐍 Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 📡 カーセンサーから在庫データ取得
        run: python3 inventory/scraper.py

      - name: 📦 デプロイ用ZIPを作成
        run: |
          zip -r deploy.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x "deploy.py" \
            -x "update.command" \
            -x ".netlify_token" \
            -x ".gitignore" \
            -x "inventory/scraper.py"

      - name: 🚀 Netlifyにデプロイ
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          python3 -c "
          import urllib.request, json, os
          token = os.environ['NETLIFY_TOKEN'].strip()
          site_id = os.environ['NETLIFY_SITE_ID'].strip()
          url = f'https://api.netlify.com/api/v1/sites/{site_id}/deploys'
          with open('deploy.zip', 'rb') as f:
              data = f.read()
          req = urllib.request.Request(url, data=data, headers={
              'Content-Type': 'application/zip',
              'Authorization': f'Bearer {token}'
          }, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  result = json.loads(resp.read().decode())
                  print(f'✅ デプロイ成功！')
                  print(f'🌐 URL: {result.get(\"ssl_url\",\"\")}')
                  print(f'📊 状態: {result.get(\"state\",\"\")}')
          except Exception as e:
              print(f'❌ デプロイ失敗: {e}')
              raise
          "

      - name: 📝 在庫データをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inventory/inventory.json inventory/inventory.js
          git diff --staged --quiet || git commit -m "🚗 在庫データ更新 $(TZ=Asia/Tokyo date '+%Y/%m/%d %H:%M')"
          git push
